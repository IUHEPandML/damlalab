<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" role="img" aria-labelledby="title desc">
  <title id="title">DAMLA Lab Logo</title>
  <desc id="desc">Data Analysis and Machine Learning Application Laboratory Logo - DAMLA LAB - 2022</desc>
  <defs>
    <!-- Top arc for the main laboratory name text -->
    <path id="text-path-top" d="M 74,300 A 226,226 0 0,1 526,300" fill="none" />
    <!-- Bottom arc for the year text -->
    <path id="text-path-bottom" d="M 74,300 A 226,226 0 0,0 526,300" fill="none" />
    
    <!-- Drop shadow for inner text and diagram elements for premium depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer ring background (Black) -->
  <circle cx="300" cy="300" r="290" fill="#0c101c" stroke="#000000" stroke-width="2" />
  
  <!-- Outer ring border separator (Light cream/gold) -->
  <circle cx="300" cy="300" r="252" fill="none" stroke="#eef0d8" stroke-width="4" />
  
  <!-- Inner circle background (Deep Navy Blue) -->
  <circle cx="300" cy="300" r="248" fill="#0f223f" />

  <!-- Outer Ring Text (Circular) -->
  <!-- Top Text: Laboratory Name -->
  <text font-family="'Outfit', 'Inter', 'Montserrat', Arial, sans-serif" font-size="16.5px" font-weight="900" fill="#eef0d8" letter-spacing="4.5px">
    <textPath href="#text-path-top" startOffset="50%" text-anchor="middle">DATA ANALYSIS AND MACHINE LEARNING  APPLICATION LABORATORY</textPath>
  </text>

  <!-- Bottom Text: Year -->
  <text font-family="'Outfit', 'Inter', 'Montserrat', Arial, sans-serif" font-size="19px" font-weight="900" fill="#eef0d8" letter-spacing="4px">
    <textPath href="#text-path-bottom" startOffset="50%" text-anchor="middle">• 2022 •</textPath>
  </text>

  <!-- Inner Content: Feynman Diagram -->
  <g filter="url(#shadow)">
    <!-- Incoming electron/positron lines (Left side) -->
    <line x1="125" y1="180" x2="205" y2="300" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <line x1="125" y1="420" x2="205" y2="300" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    
    <!-- Outgoing electron/positron lines (Right side) -->
    <line x1="395" y1="300" x2="475" y2="180" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <line x1="395" y1="300" x2="475" y2="420" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    
    <!-- Connecting wavy line (photon/boson propagator) -->
    <path d="M 205,300 
             Q 220.83,260 236.67,300 
             Q 252.5,340 268.33,300 
             Q 284.17,260 300,300 
             Q 315.83,340 331.67,300 
             Q 347.5,260 363.33,300 
             Q 379.17,340 395,300" 
          fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Brand Typography -->
  <!-- "DAMLA" -->
  <text x="300" y="375" text-anchor="middle" font-family="'Courier New', Courier, monospace, serif" font-size="56px" font-weight="900" fill="#ffffff" filter="url(#shadow)" letter-spacing="2px">DAMLA</text>
  <!-- "LAB" -->
  <text x="420" y="422" text-anchor="end" font-family="'Courier New', Courier, monospace, serif" font-size="36px" font-weight="900" fill="#ffffff" filter="url(#shadow)" letter-spacing="1px">LAB</text>
</svg>